- name: profil
  label: Profil et coordonnées
  type: file
  path: data/profil.json
  format: json
  fields:
  - name: photo
    label: Photo de profil
    type: image
    description: Image carrée, au moins 800 px de côté.
  - name: cv_pdf_fr
    label: CV PDF (français)
    type: file
  - name: cv_pdf_en
    label: CV PDF (anglais)
    type: file
  - name: telephone
    label: Téléphone
    type: string
  - name: emails
    label: Adresses e-mail
    type: object
    fields:
    - name: identifiant
      label: Partie avant le @
      type: string
    - name: domaine
      label: Partie après le @
      type: string
    list: true
    description: Coupées en deux pour cacher l'adresse aux robots de spam.
  - name: linkedin
    label: Lien LinkedIn
    type: string
  - name: lieu_fr
    label: Lieu (français)
    type: string
  - name: lieu_en
    label: Lieu (anglais)
    type: string
